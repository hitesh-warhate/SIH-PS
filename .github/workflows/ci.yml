name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Dependency scan (production dependencies)
        run: npm audit --omit=dev
      - name: Migration check (fresh database)
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -c "CREATE DATABASE ci_migrate"
          DATABASE_URL=postgres://postgres:ci@localhost:5432/ci_migrate npm run migrate
      - run: npm test
      - run: npm run build
